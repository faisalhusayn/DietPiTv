<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart TV Remote</title>
  <link rel="stylesheet" href="/css/remote.css">
</head>
<body>
  <div class="remote-wrapper">
    <!-- Header -->
    <header class="remote-header">
      <div class="remote-brand">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--accent-blue)" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>Living Room TV</span>
      </div>
      <div id="conn-indicator" class="connection-indicator">
        <span class="connection-dot"></span>
        <span id="conn-text">Connecting</span>
      </div>
    </header>

    <!-- Virtual Keyboard / Quick Text Sender -->
    <div class="text-input-bar">
      <input type="text" id="phone-text-input" class="remote-text-input" placeholder="Type on TV search..."/>
      <button type="button" id="btn-send-text" class="btn-send-text">Send</button>
    </div>

    <!-- System Controls Row -->
    <div class="system-row">
      <button type="button" class="remote-btn" data-action="BACK">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <button type="button" class="remote-btn" data-action="HOME">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Home
      </button>
      <button type="button" class="remote-btn" data-action="SEARCH">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
      <button type="button" class="remote-btn" data-action="SETTINGS">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Menu
      </button>
    </div>

    <!-- Tactile D-Pad Controller -->
    <div class="dpad-container">
      <div class="dpad-disc">
        <button type="button" class="dpad-btn dpad-btn-up" data-action="UP" aria-label="Up">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><polygon points="12,5 5,16 19,16"/></svg>
        </button>
        <button type="button" class="dpad-btn dpad-btn-left" data-action="LEFT" aria-label="Left">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><polygon points="5,12 16,5 16,19"/></svg>
        </button>
        <button type="button" class="dpad-btn dpad-btn-ok" data-action="OK" aria-label="Select">
          OK
        </button>
        <button type="button" class="dpad-btn dpad-btn-right" data-action="RIGHT" aria-label="Right">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><polygon points="19,12 8,5 8,19"/></svg>
        </button>
        <button type="button" class="dpad-btn dpad-btn-down" data-action="DOWN" aria-label="Down">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><polygon points="12,19 5,8 19,8"/></svg>
        </button>
      </div>
    </div>

    <!-- Media & Volume Controls -->
    <div class="media-volume-grid">
      <button type="button" class="remote-btn" data-action="VOL_DOWN">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Vol -
      </button>
      <button type="button" class="remote-btn" data-action="PLAY_PAUSE" style="background: var(--accent-blue); color: #ffffff;">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
        Play / Pause
      </button>
      <button type="button" class="remote-btn" data-action="VOL_UP">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Vol +
      </button>
    </div>

    <!-- Quick App Launchers -->
    <div class="quick-apps-section">
      <div class="quick-apps-title">Quick Launch</div>
      <div class="quick-apps-grid">
        <button type="button" class="quick-app-btn" onclick="sendRemoteAction('LAUNCH', {app_id: 'youtube'})">
          <img src="/assets/icons/youtube.svg" alt="YouTube"/>
        </button>
        <button type="button" class="quick-app-btn" onclick="sendRemoteAction('LAUNCH', {app_id: 'jellyfin'})">
          <img src="/assets/icons/jellyfin.svg" alt="Jellyfin"/>
        </button>
        <button type="button" class="quick-app-btn" onclick="sendRemoteAction('LAUNCH', {app_id: 'spotify'})">
          <img src="/assets/icons/spotify.svg" alt="Spotify"/>
        </button>
        <button type="button" class="quick-app-btn" onclick="sendRemoteAction('LAUNCH', {app_id: 'browser'})">
          <img src="/assets/icons/browser.svg" alt="Browser"/>
        </button>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let reconnectTimer = null;

    function initWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/remote?client_type=phone`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        updateConnectionStatus(true);
      };

      socket.onclose = () => {
        updateConnectionStatus(false);
        scheduleReconnect();
      };

      socket.onerror = () => {
        updateConnectionStatus(false);
        socket.close();
      };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        initWebSocket();
      }, 2500);
    }

    function updateConnectionStatus(isOnline) {
      const indicator = document.getElementById('conn-indicator');
      const text = document.getElementById('conn-text');
      if (isOnline) {
        indicator.classList.add('online');
        text.textContent = 'Connected';
      } else {
        indicator.classList.remove('online');
        text.textContent = 'Reconnecting';
      }
    }

    function sendRemoteAction(action, extra = {}) {
      // Haptic feedback
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(25);
      }

      const payload = { action, ...extra };

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      } else {
        // Fallback to REST API if WebSocket is reconnecting
        fetch('/api/remote/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.warn('REST fallback failed:', err));
      }
    }

    // Attach click listeners to all buttons
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        sendRemoteAction(action);
      });
    });

    // Text Input sender
    const textInput = document.getElementById('phone-text-input');
    const sendBtn = document.getElementById('btn-send-text');

    const handleSendText = () => {
      const text = textInput.value.trim();
      if (text) {
        sendRemoteAction('TEXT', { text });
        textInput.value = '';
      }
    };

    sendBtn.addEventListener('click', handleSendText);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleSendText();
      }
    });

    window.addEventListener('DOMContentLoaded', initWebSocket);
  </script>
</body>
</html>
